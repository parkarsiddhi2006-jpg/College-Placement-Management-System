<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Student Login | CPMS</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="css/style.css">
</head>

<body>

<div class="login-container">

    <div class="login-left">

        <span class="tag">STUDENT PORTAL</span>

        <h1>Welcome Back.</h1>

        <p>Login to access jobs, applications and placement updates.</p>

        <img
            src="https://storyset.imgix.net/illustrations/jobhunt.svg?auto=format"
            alt="Students">

    </div>


    <div class="login-right">

        <div class="login-card">

            <h2>Student Login</h2>

            <form id="loginForm">

                <input
                    type="email"
                    id="loginEmail"
                    placeholder="College Email"
                    required>

                <input
                    type="password"
                    id="loginPassword"
                    placeholder="Password"
                    required>

                <button
                    type="submit"
                    class="primary-btn full-btn">

                    Login

                </button>

            </form>


            <p class="bottom-text">

                New here?

                <a href="register.html">
                    Create Account
                </a>

            </p>


            <button
                class="secondary-btn full-btn"
                onclick="window.location.href='index.html'">

                Back to Home

            </button>

        </div>

    </div>

</div>


<script src="js/script.js"></script>

</body>
</html>
