<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Admin Dashboard | CPMS</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">


<style>

* {
    box-sizing: border-box;
}


body {

    margin: 0;

    font-family: 'Poppins', sans-serif;

    background: #f5f7fb;

    color: #222;

}


/* ==========================================
   HEADER
   ========================================== */

.header {

    background: linear-gradient(
        135deg,
        #4f46e5,
        #7c3aed
    );

    color: white;

    padding: 22px 45px;

    display: flex;

    justify-content: space-between;

    align-items: center;

}


.header h1 {

    margin: 0;

    font-size: 25px;

}


.header p {

    margin: 5px 0 0;

    opacity: .9;

}


.logout {

    border: none;

    background: white;

    color: #4f46e5;

    padding: 10px 20px;

    border-radius: 8px;

    font-weight: 600;

    cursor: pointer;

}


.logout:hover {

    background: #f1f1ff;

}


/* ==========================================
   MAIN CONTAINER
   ========================================== */

.container {

    padding: 35px 45px;

}


/* ==========================================
   STATISTICS
   ========================================== */

.stats {

    display: grid;

    grid-template-columns:
        repeat(4, 1fr);

    gap: 20px;

    margin-bottom: 30px;

}


.card,
.section {

    background: white;

    border-radius: 14px;

    box-shadow:
        0 4px 15px rgba(0,0,0,.07);

}


.card {

    padding: 25px;

}


.card h3 {

    margin: 0;

    font-size: 14px;

    color: #777;

}


.card h2 {

    margin: 10px 0 0;

    color: #4f46e5;

    font-size: 30px;

}


/* ==========================================
   SECTIONS
   ========================================== */

.section {

    padding: 30px;

    margin-bottom: 30px;

}


.section h2 {

    margin-top: 0;

}


/* ==========================================
   TABLE
   ========================================== */

.table-container {

    overflow-x: auto;

}


table {

    width: 100%;

    border-collapse: collapse;

    margin-top: 20px;

}


th,
td {

    padding: 14px;

    border-bottom: 1px solid #eee;

    text-align: left;

}


th {

    background: #f4f3ff;

    color: #4f46e5;

    font-weight: 600;

}


tr:hover {

    background: #fafaff;

}


/* ==========================================
   STATUS
   ========================================== */

.status {

    background: #fff7ed;

    color: #ea580c;

    padding: 6px 12px;

    border-radius: 20px;

    font-size: 13px;

    font-weight: 600;

}


.message {

    text-align: center;

    padding: 20px;

    color: #777;

}


.error {

    color: #dc2626;

}


/* ==========================================
   MOBILE
   ========================================== */

@media (max-width: 900px) {

    .stats {

        grid-template-columns:
            repeat(2, 1fr);

    }

}


@media (max-width: 600px) {

    .header {

        padding: 20px;

    }


    .container {

        padding: 20px;

    }


    .stats {

        grid-template-columns: 1fr;

    }

}

</style>

</head>


<body>


<!-- ==========================================
     HEADER
     ========================================== -->

<header class="header">

    <div>

        <h1>
            College Placement Management System
        </h1>

        <p>
            Admin Dashboard
        </p>

    </div>


    <button
        class="logout"
        onclick="window.location.href='index.html'">

        Logout

    </button>

</header>



<main class="container">


    <!-- ==========================================
         STATISTICS
         ========================================== -->

    <div class="stats">


        <div class="card">

            <h3>
                Registered Students
            </h3>

            <h2 id="studentCount">
                0
            </h2>

        </div>


        <div class="card">

            <h3>
                Companies
            </h3>

            <h2>
                3
            </h2>

        </div>


        <div class="card">

            <h3>
                Placement Drives
            </h3>

            <h2>
                3
            </h2>

        </div>


        <div class="card">

            <h3>
                Applications
            </h3>

            <h2 id="applicationCount">
                0
            </h2>

        </div>

    </div>



    <!-- ==========================================
         REGISTERED STUDENTS
         ========================================== -->

    <section class="section">

        <h2>
            Registered Students
        </h2>


        <div class="table-container">

            <table>

                <thead>

                    <tr>

                        <th>
                            Name
                        </th>

                        <th>
                            Email
                        </th>

                        <th>
                            Branch
                        </th>

                        <th>
                            CGPA
                        </th>

                        <th>
                            Skills
                        </th>

                    </tr>

                </thead>


                <tbody id="studentTable">

                </tbody>

            </table>

        </div>


        <div
            id="studentMessage"
            class="message">

            Loading students...

        </div>

    </section>



    <!-- ==========================================
         STUDENT APPLICATIONS
         ========================================== -->

    <section class="section">

        <h2>
            Student Applications
        </h2>


        <div class="table-container">

            <table>

                <thead>

                    <tr>

                        <th>
                            Student Name
                        </th>

                        <th>
                            Email
                        </th>

                        <th>
                            Company
                        </th>

                        <th>
                            Position
                        </th>

                        <th>
                            Status
                        </th>

                    </tr>

                </thead>


                <tbody id="applicationTable">

                </tbody>

            </table>

        </div>


        <div
            id="applicationMessage"
            class="message">

            Loading applications...

        </div>

    </section>


</main>



<script>


/* ==========================================
   LOAD REGISTERED STUDENTS
   ========================================== */

async function loadStudents() {


    const table =
        document.getElementById(
            "studentTable"
        );


    const message =
        document.getElementById(
            "studentMessage"
        );


    const count =
        document.getElementById(
            "studentCount"
        );


    try {


        const response =
            await fetch(
                "http://localhost:8080/api/students"
            );


        if (!response.ok) {

            throw new Error(
                "Backend error"
            );

        }


        const students =
            await response.json();


        table.innerHTML = "";


        count.textContent =
            students.length;


        if (students.length === 0) {

            message.textContent =
                "No students registered yet.";

            return;

        }


        message.style.display =
            "none";


        students.forEach(
            function(student) {


                const row =
                    document.createElement(
                        "tr"
                    );


                row.innerHTML = `

                    <td>
                        ${student.name}
                    </td>

                    <td>
                        ${student.email}
                    </td>

                    <td>
                        ${student.branch}
                    </td>

                    <td>
                        ${student.cgpa}
                    </td>

                    <td>
                        ${student.skills}
                    </td>

                `;


                table.appendChild(row);

            }
        );


    } catch (error) {


        count.textContent = "0";


        message.innerHTML =

            '<span class="error">' +

            'Cannot connect to backend. ' +

            'Make sure Spring Boot is running on port 8080.' +

            '</span>';

    }

}



/* ==========================================
   LOAD STUDENT APPLICATIONS
   ========================================== */

function loadApplications() {


    const applications =

        JSON.parse(

            localStorage.getItem(
                "cpmsApplications"
            )

        ) || [];


    const students =

        JSON.parse(

            localStorage.getItem(
                "cpmsStudents"
            )

        ) || [];


    const table =

        document.getElementById(
            "applicationTable"
        );


    const message =

        document.getElementById(
            "applicationMessage"
        );


    const count =

        document.getElementById(
            "applicationCount"
        );


    /* Show total applications */

    count.textContent =
        applications.length;


    table.innerHTML = "";


    /* No applications */

    if (applications.length === 0) {

        message.textContent =
            "No applications submitted yet.";

        return;

    }


    message.style.display =
        "none";


    /* ======================================
       DISPLAY EACH APPLICATION
       ====================================== */

    applications.forEach(
        function(app) {


            const row =
                document.createElement(
                    "tr"
                );


            /* Find student's name using email */

            const student =
                students.find(
                    function(s) {

                        return s.email === app.email;

                    }
                );


            const studentName =
                student
                    ? student.name
                    : "Unknown Student";


            row.innerHTML = `

                <td>
                    <strong>
                        ${studentName}
                    </strong>
                </td>

                <td>
                    ${app.email}
                </td>

                <td>
                    ${app.company}
                </td>

                <td>
                    ${app.position}
                </td>

                <td>

                    <span class="status">

                        ${app.status}

                    </span>

                </td>

            `;


            table.appendChild(row);

        }
    );

}



/* ==========================================
   START DASHBOARD
   ========================================== */

loadStudents();

loadApplications();


</script>


</body>

</html>
